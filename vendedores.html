<style>
:root{color-scheme:light;--bg:#f4f5fb;--ink:#10132a;--mut:#565c78;--mut2:#8890ac;--line:#e0e3f0;--surface2:#edeff8;--navy:#082d74;--navy-s:#051c4a;--navy2:#082d74;--tint:#e6eaf5;--gold:#d99a2b;--bad:#c23b3b;--warn:#b9791f;--warnbg:#faf0dd;--radius:14px;--shadow:0 1px 2px rgba(16,19,42,.05),0 10px 28px -14px rgba(16,19,42,.22)}
*{box-sizing:border-box}
body{margin:0;font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font-family:inherit}
.top{background:var(--navy);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.top h1{font-size:16px;margin:0 8px 0 0;font-weight:650}
.sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 13px;border-radius:6px;cursor:pointer;font-size:13.5px}
.btn:hover{border-color:#b8bfcb}
.btn.p{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600}
.btn.s{padding:4px 9px;font-size:12.5px}
.btn.d{color:var(--bad)}
.top .btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.top .btn.p{background:var(--gold)}
.wrap{display:grid;grid-template-columns:400px 1fr;gap:18px;padding:18px;max-width:1300px;margin:0 auto;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 0 8px}
.panel h2:first-child{margin-top:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--mut);font-weight:600;margin-bottom:8px}
input,select,textarea{font:inherit;font-size:14px;padding:7px 9px;border:1px solid #cdd3dc;border-radius:6px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #a9c4e4;border-color:var(--navy2)}
.big input{font-size:18px;font-weight:650}
.gl{display:grid;grid-template-columns:22px 1fr 120px;gap:8px;align-items:center;padding:5px 0}
.gl .n{width:20px;height:20px;border-radius:50%;background:#eef3f9;color:var(--navy);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.gl .l{font-size:13.5px}
.gl input{text-align:right}
.gl .l small{display:block;color:var(--mut);font-size:11px}
.pst{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:13px;color:var(--navy);margin:12px 0 8px;padding-top:10px;border-top:1px dashed #d5dbe4}
.pst:first-child{border-top:0;padding-top:0;margin-top:4px}
.pst b{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;align-items:center;justify-content:center;flex:none}
.pst span{font-weight:400;color:var(--mut);font-size:12px}
.ver{border-radius:6px;padding:8px 10px;font-size:13px;margin:0 0 4px;line-height:1.4}
.ver:empty{display:none}
.ver.si{background:#fdf0e3;color:#8a4a0b}.ver.no{background:#e3f3e8;color:#1f6b3d}
.sinrec{background:#fff;border:1px solid var(--line);border-radius:6px;margin:0 0 6px}
.sinrec summary{font-size:12.5px;padding:6px 9px;font-weight:600;color:var(--navy2);cursor:pointer}
.sinrec>.two,.sinrec>label,.sinrec>.hint{margin-left:9px;margin-right:9px}
input[type=date]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;min-height:36px}
.honbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 6px 30px}
.seg2{display:inline-flex;border:1px solid #cdd3dc;border-radius:7px;overflow:hidden}
.seg2 button{border:0;background:#fff;padding:5px 10px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.seg2 button.on{background:var(--navy);color:#fff;font-weight:600}
.pctin{display:inline-flex;align-items:center;gap:4px}
.pctin input{width:64px;padding:5px 7px;text-align:right}
.hon{display:flex;gap:4px;align-items:center}
.hon input{width:58px;padding:4px 6px;font-size:13px;text-align:right}
.hon label{font-size:11.5px;color:var(--mut);display:flex;gap:3px;align-items:center;white-space:nowrap}
.hon label input{width:auto}
details{background:#f6f8fb;border-radius:6px;margin:2px 0 6px 30px;font-size:12.5px}
details summary{cursor:pointer;padding:5px 9px;color:var(--navy2);font-weight:600}
details .in{padding:2px 9px 9px}
details .res{margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{display:grid;grid-template-columns:22px 1fr 100px 26px;gap:6px;align-items:center;padding:4px 0}
.x input{font-size:13px;padding:5px 7px}
.x input+input{text-align:right}
.x button{border:0;background:none;color:var(--mut);cursor:pointer;font-size:15px}
.tot{margin-top:10px;background:var(--navy);color:#fff;border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.tot b{font-size:20px}
.sub{display:flex;justify-content:space-between;padding:6px 2px;font-size:13px;color:var(--mut)}
.sub b{color:var(--ink)}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;margin-top:6px}
.chk input{width:auto}
.hint{font-size:11.5px;color:var(--mut);line-height:1.4}
.warn{background:var(--warnbg);color:var(--warn);border-radius:6px;padding:6px 9px;font-size:12px;margin-top:8px}
.prev{position:sticky;top:64px}
.prev .bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c2533;color:#fff;padding:9px 16px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.toast{display:flex;gap:12px;align-items:center}
.toast button{background:none;border:0;color:#e0b45c;font-weight:700;font-size:14px;cursor:pointer;padding:2px 4px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;z-index:30;overflow:auto;padding:30px 12px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:12px;width:100%;max-width:620px;padding:18px 20px}
.mbox h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center}
.mbox h3 button{margin-left:auto}
.it{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it .m{flex:1;min-width:0;cursor:pointer}
.it .m b{display:block}
.it .m span{color:var(--mut);font-size:12.5px}

/* ============ HOJA PARA EL VENDEDOR (1 folio A4) ============ */
.doc{background:#fff;width:210mm;min-height:297mm;padding:16mm 16mm 14mm;box-shadow:0 4px 20px rgba(0,0,0,.13);margin:0 auto;color:#1c2533;font-size:10pt;line-height:1.45;display:flex;flex-direction:column;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.dh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--navy);padding-bottom:5mm}
.dh .lg img{max-height:17mm;max-width:70mm}
.dh .lg .an{font-family:Georgia,serif;font-size:17pt;color:var(--navy)}
.dh .lg .sb{font-size:8.5pt;color:#7a8494}
.dh .tt{text-align:right}
.dh .tt b{display:block;font-family:Georgia,serif;font-weight:normal;font-size:16pt;color:var(--navy)}
.dh .tt span{font-size:9pt;color:#7a8494}
.di{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:5mm;margin:5mm 0;font-size:9.5pt}
.di span{display:block;font-size:7.5pt;color:#8a93a2;text-transform:uppercase;letter-spacing:.06em}
.kp{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3mm;margin-bottom:5mm}

const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};

/* ================= UTILIDADES ================= */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hoyF(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
const money=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(/\s|€/g,'').replace(/\./g,'').replace(',','.'));return isFinite(n)?n:null};
const dec=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(/\s|%/g,'').replace(',','.'));return isFinite(n)?n:null};
const fmt=(n,d=0)=>new Intl.NumberFormat('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'}).format(n||0);
const eur=n=>(n<0?'−':'')+fmt(Math.abs(Math.round(n||0)))+' €';
const vIn=v=>v==null||v===''?'':fmt(v,v%1?2:0);
const fLarga=s=>s?new Date(s+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}):'';
function toast(t,acc){const x=$('#toast');acc=acc||[];x.innerHTML='<span>'+esc(t)+'</span>'+acc.map((a,i)=>'<button data-ti="'+i+'">'+esc(a[0])+'</button>').join('');
  x.querySelectorAll('[data-ti]').forEach(b=>b.onclick=()=>{x.classList.remove('on');acc[+b.dataset.ti][1]()});
  x.style.pointerEvents=acc.length?'auto':'none';x.classList.add('on');clearTimeout(x._t);x._t=setTimeout(()=>x.classList.remove('on'),acc.length?9000:2400)}

function honBase(o,P){return o.honModo==='eur'?(o.honEur||0):P*(o.honPct||0)/100}
function honorarios(o,P){const b=honBase(o,P);return b*(o.honIva?1+cfg.iva/100:1)}
function calc(o,precio){
  const P=precio!=null?precio:(o.precio||0);
  const hon=honorarios(o,P);

  return {P,hon,ext,gastos,firma,irpf:o.irpf||0,neto:firma-(o.irpf||0),totalGI:(o.hip||0)+gastos+(o.irpf||0),honB:honBase(o,P)};
}

const KM='gastosventa_muestras';

const sbH=k=>({'apikey':k,'Authorization':'Bearer '+k,'Content-Type':'application/json'});
async function nubeCargar(){
  const {url,key}=sbCfg();if(!key){nubeEstado='off';return}
  try{const r=await fetch(url+'/rest/v1/zonas_suelo?select=id,zona,municipio,m2,suelo,comercial,created_at&order=created_at.desc&limit=5000',{headers:sbH(key)});
    if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,120));
    nube=(await r.json()).map(x=>({id:x.id,zona:x.zona,muni:x.municipio,m2:+x.m2,suelo:+x.suelo,com:x.comercial,fecha:x.created_at,nube:1}));
    nubeEstado='ok';
    // sube los recibos locales que aún no estén en la nube
    const ids=new Set(nube.map(x=>x.id));const pend=muestras.filter(x=>!ids.has(x.id));
    if(pend.length&&await nubeSubir(pend))nube=nube.concat(pend.map(x=>Object.assign({},x,{nube:1})));
  }catch(err){nubeEstado='error: '+err.message;console.warn(err)}
  refrescarZonas();

async function nubeSubir(arr){
  const {url,key}=sbCfg();if(!key||!arr.length)return false;
  try{const r=await fetch(url+'/rest/v1/zonas_suelo',{method:'POST',headers:Object.assign(sbH(key),{'Prefer':'return=minimal,resolution=ignore-duplicates'}),
      body:JSON.stringify(arr.map(x=>({id:x.id,zona:x.zona,municipio:x.muni||null,m2:x.m2,suelo:x.suelo,comercial:x.com||null})))});
    if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,120));nubeEstado='ok';return true}
  catch(err){nubeEstado='error: '+err.message;console.warn(err);return false}
}
function todasMuestras(){const m=new Map();nube.concat(muestras).forEach(x=>{if(!m.has(x.id))m.set(x.id,x)});return [...m.values()]}
function zonasStats(){
  const g={};
  todasMuestras().forEach(x=>{if(!x.zona||!(x.m2>0)||!(x.suelo>0))return;const k=norm2(x.zona);(g[k]=g[k]||{nombre:x.zona,n:0,s:0,min:1e9,max:0,muni:x.muni});const em=x.suelo/x.m2;g[k].n++;g[k].s+=em;g[k].min=Math.min(g[k].min,em);g[k].max=Math.max(g[k].max,em)});
  const out=Object.values(g).map(z=>({nombre:z.nombre,em:z.s/z.n,n:z.n,min:z.min,max:z.max,muni:z.muni}));
  (cfg.zonasSuelo||[]).forEach(([n,v])=>{if(!out.some(z=>norm2(z.nombre)===norm2(n)))out.push({nombre:n,em:v,n:0,manual:1})});
  return out.sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
}
const zonaMax=()=>zonasStats().filter(z=>z.n).sort((a,b)=>(b.n?b.max:b.em)-(a.n?a.max:a.em))[0]||null;
const zonaInfo=n=>{const k=norm2(n);if(k.length<3)return null;const zs=zonasStats();
  return zs.find(z=>norm2(z.nombre)===k)||zs.find(z=>{const q=norm2(z.nombre);return q.length>=3&&(q.includes(k)||k.includes(q))})||null};

function registrarMuestra(zona,m2,suelo){
  zona=(zona||'').replace(/[,\s]+(n[ºo°.]?\s*)?\d+.*$/i,'').trim()||(zona||'').trim();if(!zona||!(m2>0)||!(suelo>0))return null;
  const em=suelo/m2;if(em<15||em>3000){toast('⚠ '+fmt(em,2)+' €/m² parece raro: revisa suelo y m²');return null}
  if(todasMuestras().some(x=>norm2(x.zona)===norm2(zona)&&Math.abs(x.m2-m2)<0.01&&Math.abs(x.suelo-suelo)<0.01))return 'dup';

const norm2=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')

  .replace(/\b(avenida|avda|av|calle|c|plaza|pza|pl|urbanizacion|urb|barriada|bda|paseo|pº|ronda|glorieta|conjunto|residencial|res|de|del|la|las|los|el)\b/g,' ')
  .replace(/\b\d+[a-z]?\b/g,' ').replace(/\s+/g,' ').trim();
function calcPlus(){
  let s=money($('#pv_s').value);const f=$('#pv_f').value,t=dec($('#pv_t').value),m2=dec($('#pv_m2').value),em=dec($('#pv_em').value);pvVal=null;

  if(!s&&m2&&em){s=m2*em;est=true}
  const pcm=money($('#pv_c').value);pvSinInc=false;pvDet='';
  {const ver=$('#pv_ver');if(ver){if(pcm&&e.precio){const g=e.precio-pcm;ver.className='ver '+(g>0?'si':'no');
    ver.innerHTML='Compró por '+eur(pcm)+' y vende por '+eur(e.precio)+' → '+(g>0?'gana <b>'+eur(g)+'</b> → <b>paga plusvalía</b>':(g===0?'no gana nada':'pierde '+eur(-g))+' → <b>no paga plusvalía</b>')}
    else if(pcm&&!e.precio){ver.className='ver si';ver.innerHTML='Pon el precio de venta arriba para comparar.'}
    else{ver.className='ver';ver.innerHTML=''}}}
  if(pcm&&e.precio&&e.precio<=pcm){pvVal=0;pvSinInc=true;$('#pv_r').innerHTML='Vende por '+eur(e.precio)+' y compró por '+eur(pcm)+': <b>no hay incremento → no paga plusvalía (0 €)</b>.<br><span class="hint">Hay que acreditarlo en el Ayuntamiento con las escrituras de compra y venta.</span>';return}
  if(!s||!f||t==null){$('#pv_r').textContent=!s?'Pon el suelo del recibo, o los m² y el €/m² de la zona.':'Pon la fecha de compra.';return}
  const a=new Date(f+'T12:00:00'),b=new Date();let m=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());if(b.getDate()<a.getDate())m--;m=Math.max(0,m);
  const y=Math.floor(m/12),coef=y<1?COEF[0]*m/12:COEF[Math.min(y,20)];
  const pc=Math.min(100,Math.max(0,dec($('#pv_p').value)??100));
  const obj=Math.round(s*(pc/100)*coef*t/100*100)/100;
  // Método real (art. 104.5 y 107.5 TRLRHL): ganancia × (suelo ÷ catastral total). Se paga el más bajo.
  const vt=money($('#pv_vt').value);let real=null,txtReal='';
  if(pcm&&e.precio&&!est&&vt&&vt>=s){real=Math.round((e.precio-pcm)*(s/vt)*(pc/100)*t/100*100)/100;
    txtReal='<br>Método real: ganancia '+eur(e.precio-pcm)+' × '+fmt(s/vt*100,1)+' % suelo → '+fmt(real,2)+' €'}
  else if(pcm&&e.precio)txtReal='<br><span class="hint">Pon el valor catastral total del recibo para comprobar si sale más barato el método real.</span>';
  else if(!pcm)txtReal='<br><span class="hint">Pon el precio de compra: si vende por menos no paga, y si gana poco puede salir más barato.</span>';
  pvVal=real!=null&&real<obj?real:obj;
  // margen cuando el suelo es estimado: horquilla con el €/m² más bajo y más alto conocidos
  let marg='';
  if(est&&m2){const zs=zonasStats().filter(z=>z.n);if(zs.length&&Math.max(...zs.map(z=>z.max))-Math.min(...zs.map(z=>z.min))>0.5){const lo=Math.min(...zs.map(z=>z.min)),hi=Math.max(...zs.map(z=>z.max));
    const k=coef*(pc/100)*t/100;const a1=m2*lo*k,a2=m2*hi*k;
    marg='<br><span class="hint">Horquilla con los recibos conocidos ('+fmt(lo,0)+'–'+fmt(hi,0)+' €/m²): '+eur(a1)+' – '+eur(a2)+' · margen ±'+eur((a2-a1)/2)+'</span>'}}
  const mu=($('#pv_mu')&&$('#pv_mu').value)||'';
  pvDet=(real!=null&&real<obj)
    ?'Método real (el más favorable): ganancia '+eur(e.precio-pcm)+' × '+fmt(s/vt*100,1)+' % de suelo'+(pc<100?' × '+fmt(pc,0)+' %':'')+' × '+fmt(t,2)+' %'+(mu?' ('+mu+')':'')
    :'Valor del suelo '+eur(s)+(est?' (estimado)':'')+' × coef. '+fmt(coef,2)+' ('+(y>=20?'20 años o más':y+(y===1?' año':' años'))+')'+(pc<100?' × '+fmt(pc,0)+' %':'')+' × '+fmt(t,2)+' %'+(mu?' ('+mu+')':'');
  $('#pv_r').innerHTML=(usoMax?'<span style="color:#9a4a0b">⚠ Zona sin datos: se usa el €/m² más alto conocido ('+fmt(usoMax.max,2)+' €/m² · '+esc(usoMax.nombre)+'), estimación por arriba.</span><br>':'')+(est?'Suelo estimado: '+fmt(m2,0)+' m² × '+fmt(s/m2,2)+' €/m² = '+eur(s)+'<br>':'')+'Método objetivo: '+(y>=20?'20 años o más (tope)':y+(y===1?' año':' años'))+' · coef. '+fmt(coef,2)+(pc<100?' · '+fmt(pc,0)+' %':'')+' → '+fmt(obj,2)+' €'+txtReal+
    '<br>Se aplica el más bajo → <b>'+fmt(pvVal,2)+' €</b>'+(real!=null&&real<obj?' (real)':'')+marg+
    (pvSueloReal?'<br><span class="hint">Recibo real: '+fmt(pvSueloReal.em,2)+' €/m²'+($('#pv_z').value.trim()?' · se guardará en «'+esc($('#pv_z').value.trim())+'» al pulsar Usar':' · escribe la zona para guardarlo')+'</span>':'');
}

  if(!z){z=prompt('Nombre de la calle, zona o urbanización (ej. Av. Ciencias):','');if(!z)return;$('#pv_z').value=z.trim()}
  const r=registrarMuestra(z,pvSueloReal.m2,pvSueloReal.m2*pvSueloReal.em);
  if(r&&r!=='dup')toast('📍 Recibo guardado en «'+z.trim().replace(/[,\s]+(n[ºo°.]?\s*)?\d+.*$/i,'')+'» · '+fmt(pvSueloReal.em,2)+' €/m²');
}
function usarPlus(){if(pvVal==null){toast('Faltan datos');return}
  e.plusExenta=pvSinInc;
  if(pvSueloReal&&($('#pv_z').value||'').trim())guardarZona();
 e.plus=pvVal;e.plusDet=pvSinInc?'':pvDet;$('[data-k=plus]').value=vIn(pvVal);$('#dplus').open=false;guardar();pintarTotales();pintarDoc();calcIrpf()}
let irDet='';
function calcIrpf(){
  const cp=money($('#ir_c').value);irVal=null;
  if(!cp){$('#ir_r').textContent='Rellena el precio de compra.';return}
  const n=Math.max(1,Math.round(money($('#ir_n').value)||1));
  const P=e.precio||0,hon=honorarios(e,P);
  const gan=P-hon-(e.plus||0)-(e.matriz||0)-(cp+(money($('#ir_g').value)||0)+(money($('#ir_m').value)||0));
  if(gan<=0){irVal=0;irDet='Sin ganancia patrimonial: no tributa';$('#ir_r').innerHTML='Sin ganancia → <b>0 €</b>';return}
  irVal=Math.round(cuotaAhorro(gan/n)*n);
  irDet='Ganancia '+eur(gan)+(n>1?' entre '+n+' titulares ('+eur(gan/n)+' cada uno)':'')+' · tipo medio '+fmt(irVal/gan*100,1)+' % (escala del ahorro)';
  $('#ir_r').innerHTML='Ganancia '+eur(gan)+(n>1?' ('+n+' titulares)':'')+' → <b>'+eur(irVal)+'</b>';
}
function usarIrpf(){if(irVal==null){toast('Faltan datos');return}e.irpf=irVal;e.irpfDet=irDet;$('[data-k=irpf]').value=vIn(irVal);$('#dirpf').open=false;guardar();pintarTotales();pintarDoc()}

/* ================= PDF DIRECTO (funciona también desde la pantalla de inicio del iPhone) ================= */
const LIBS=['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js','https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'];
let libsP=null;
function cargarLibs(){if(libsP)return libsP;libsP=Promise.all(LIBS.map(src=>new Promise((ok,ko)=>{const sc=document.createElement('script');sc.src=src;sc.onload=ok;sc.onerror=()=>ko(new Error('No se pudo cargar '+src.split('/').pop()));document.head.appendChild(sc)}))).catch(err=>{libsP=null;throw err});return libsP}
function nombrePDF(){return ('Gastos venta - '+(e.direccion||e.propietario||'estudio')).replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim().slice(0,80)+'.pdf'}
async function compartirODescargar(file){
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:file.name});return}
    catch(err){if(err&&err.name==='AbortError')return;
      // Safari pide un toque nuevo para compartir: botón en el aviso
      toast('PDF listo',[['Compartir',()=>navigator.share({files:[file],title:file.name}).catch(()=>{})],['Descargar',()=>descargarBlob(file)]]);return}
  }
  descargarBlob(file);toast('PDF descargado');
}
function descargarBlob(file){const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
async function hacerPDF(){
  const b=$('#bPdf');if(b.disabled)return;b.disabled=true;const t0=b.textContent;b.textContent='⏳ Generando…';
  let holder=null;
  try{
    guardar(1);pintarDoc();await cargarLibs();
    holder=document.createElement('div');holder.className='pdfmode';holder.style.cssText='position:fixed;left:-12000px;top:0;width:794px;background:#fff;z-index:-1';
    const clon=$('#doc').cloneNode(true);clon.removeAttribute('id');holder.appendChild(clon);document.body.appendChild(holder);
    await new Promise(r=>setTimeout(r,60));
    const canvas=await html2canvas(clon,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:900});
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',compress:true});
    const W=210,H=297,ph=canvas.width*H/W; // alto de página en px del canvas
    if(canvas.height<=ph*1.3){ // cabe en un folio: se ajusta entero a una página
      const k=Math.min(1,ph/canvas.height),w=W*k,h=canvas.height*W/canvas.width*k;
      pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',(W-w)/2,0,w,h);
    }else for(let y=0,pg=0;y<canvas.height-2;y+=ph,pg++){
      const c=document.createElement('canvas');c.width=canvas.width;c.height=Math.min(ph,canvas.height-y);
      const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);cx.drawImage(canvas,0,y,c.width,c.height,0,0,c.width,c.height);
      if(pg)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,W,c.height*W/c.width);
    }
    const file=new File([pdf.output('blob')],nombrePDF(),{type:'application/pdf'});
    await compartirODescargar(file);
  }catch(err){console.error(err);toast('⚠ No se pudo generar el PDF'+(err&&err.message?': '+err.message:''))}
  finally{if(holder)holder.remove();b.disabled=false;b.textContent=t0}
}
// precarga en segundo plano para que el PDF salga al instante
setTimeout(()=>cargarLibs().catch(()=>{}),1500);
