<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gastos de Venta</title>
<style>
:root{--bg:#eef0f3;--ink:#1c2533;--mut:#6b7385;--line:#e1e4ea;--navy:#1f3a5f;--navy2:#2c5282;--gold:#b8913f;--bad:#b42318;--warn:#9a4a0b;--warnbg:#fdf0e3}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.top{background:var(--navy);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.top h1{font-size:16px;margin:0 8px 0 0;font-weight:650}
.sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 13px;border-radius:6px;cursor:pointer;font-size:13.5px}
.btn:hover{border-color:#b8bfcb}
.btn.p{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600}
.btn.s{padding:4px 9px;font-size:12.5px}
.btn.d{color:var(--bad)}
.top .btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.top .btn.p{background:var(--gold)}
.wrap{display:grid;grid-template-columns:400px 1fr;gap:18px;padding:18px;max-width:1300px;margin:0 auto;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 0 8px}
.panel h2:first-child{margin-top:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--mut);font-weight:600;margin-bottom:8px}
input,select,textarea{font:inherit;font-size:14px;padding:7px 9px;border:1px solid #cdd3dc;border-radius:6px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #a9c4e4;border-color:var(--navy2)}
.big input{font-size:18px;font-weight:650}
.gl{display:grid;grid-template-columns:22px 1fr 120px;gap:8px;align-items:center;padding:5px 0}
.gl .n{width:20px;height:20px;border-radius:50%;background:#eef3f9;color:var(--navy);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.gl .l{font-size:13.5px}
.gl input{text-align:right}
.gl .l small{display:block;color:var(--mut);font-size:11px}
.honbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 6px 30px}
.seg2{display:inline-flex;border:1px solid #cdd3dc;border-radius:7px;overflow:hidden}
.seg2 button{border:0;background:#fff;padding:5px 10px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.seg2 button.on{background:var(--navy);color:#fff;font-weight:600}
.pctin{display:inline-flex;align-items:center;gap:4px}
.pctin input{width:64px;padding:5px 7px;text-align:right}
.hon{display:flex;gap:4px;align-items:center}
.hon input{width:58px;padding:4px 6px;font-size:13px;text-align:right}
.hon label{font-size:11.5px;color:var(--mut);display:flex;gap:3px;align-items:center;white-space:nowrap}
.hon label input{width:auto}
details{background:#f6f8fb;border-radius:6px;margin:2px 0 6px 30px;font-size:12.5px}
details summary{cursor:pointer;padding:5px 9px;color:var(--navy2);font-weight:600}
details .in{padding:2px 9px 9px}
details .res{margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{display:grid;grid-template-columns:22px 1fr 100px 26px;gap:6px;align-items:center;padding:4px 0}
.x input{font-size:13px;padding:5px 7px}
.x input+input{text-align:right}
.x button{border:0;background:none;color:var(--mut);cursor:pointer;font-size:15px}
.tot{margin-top:10px;background:var(--navy);color:#fff;border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.tot b{font-size:20px}
.sub{display:flex;justify-content:space-between;padding:6px 2px;font-size:13px;color:var(--mut)}
.sub b{color:var(--ink)}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;margin-top:6px}
.chk input{width:auto}
.hint{font-size:11.5px;color:var(--mut);line-height:1.4}
.warn{background:var(--warnbg);color:var(--warn);border-radius:6px;padding:6px 9px;font-size:12px;margin-top:8px}
.prev{position:sticky;top:64px}
.prev .bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c2533;color:#fff;padding:9px 16px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;z-index:30;overflow:auto;padding:30px 12px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:12px;width:100%;max-width:620px;padding:18px 20px}
.mbox h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center}
.mbox h3 button{margin-left:auto}
.it{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it .m{flex:1;min-width:0;cursor:pointer}
.it .m b{display:block}
.it .m span{color:var(--mut);font-size:12.5px}

/* ============ HOJA PARA EL VENDEDOR (1 folio A4) ============ */
.doc{background:#fff;width:210mm;min-height:297mm;padding:16mm 16mm 14mm;box-shadow:0 4px 20px rgba(0,0,0,.13);margin:0 auto;color:#1c2533;font-size:10pt;line-height:1.45;display:flex;flex-direction:column;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.dh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--navy);padding-bottom:5mm}
.dh .lg img{max-height:17mm;max-width:70mm}
.dh .lg .an{font-family:Georgia,serif;font-size:17pt;color:var(--navy)}
.dh .lg .sb{font-size:8.5pt;color:#7a8494}
.dh .tt{text-align:right}
.dh .tt b{display:block;font-family:Georgia,serif;font-weight:normal;font-size:16pt;color:var(--navy)}
.dh .tt span{font-size:9pt;color:#7a8494}
.di{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:5mm;margin:5mm 0;font-size:9.5pt}
.di span{display:block;font-size:7.5pt;color:#8a93a2;text-transform:uppercase;letter-spacing:.06em}
.kp{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3mm;margin-bottom:5mm}
.kp div{border:1px solid #e1e4ea;border-radius:2mm;padding:3.5mm 4mm}
.kp span{display:block;font-size:7.5pt;color:#7a8494;text-transform:uppercase;letter-spacing:.05em}
.kp b{font-size:16pt;font-variant-numeric:tabular-nums}
.kp .hl{background:var(--navy);border-color:var(--navy);color:#fff}
.kp .hl span{color:#c9d6e6}
.dt{font-size:9pt;text-transform:uppercase;letter-spacing:.07em;color:var(--navy);font-weight:700;margin:4mm 0 2mm;border-bottom:1.5px solid var(--gold);padding-bottom:1.5mm}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.t td,table.t th{padding:2.1mm 2.5mm;border-bottom:1px solid #eceef2;text-align:left;vertical-align:top}
table.t th{font-size:7.5pt;text-transform:uppercase;letter-spacing:.05em;color:#8a93a2;font-weight:600}
table.t .r{text-align:right;white-space:nowrap}
table.t .nn{color:#a0a8b5;width:6mm}
table.t td small{display:block;font-size:8pt;color:#8a93a2}
table.t tr.st td{font-weight:700;background:#f4f6f9;border-top:1.5px solid #cfd4dc}
table.t tr.fin td{font-weight:700;background:var(--navy);color:#fff;font-size:11pt}
table.t tr.cur td{background:#f5f0e3}
.vb{display:flex;height:6mm;border-radius:1.2mm;overflow:hidden;margin:4mm 0 2mm}
.vl{display:flex;flex-wrap:wrap;gap:1mm 5mm;font-size:8pt;color:#4a5465}
.vl i{display:inline-block;width:2.6mm;height:2.6mm;border-radius:.5mm;margin-right:1.2mm;vertical-align:-.2mm}
.obs{background:#f7f8fa;border-left:3px solid var(--gold);padding:2.5mm 4mm;font-size:9pt;margin-top:4mm}
.df{margin-top:auto;padding-top:5mm}
.df .lgl{font-size:7.5pt;color:#8a93a2;line-height:1.4;border-top:1px solid #eceef2;padding-top:3mm}
.df .ct{display:flex;justify-content:space-between;font-size:8.5pt;color:#4a5465;margin-top:3mm}
.df .ct b{color:var(--navy)}

@media(max-width:1100px){.wrap{grid-template-columns:1fr}.prev{position:static}.docw{overflow-x:auto}}
@media(max-width:820px){.doc{width:100%;min-height:0;padding:20px 16px;font-size:12.5px}.di{grid-template-columns:1fr 1fr}.kp b{font-size:18px}}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .top,.panel,.prev .bar,.toast,.modal{display:none!important}
  .wrap{display:block;padding:0;max-width:none}
  .prev{position:static}
  .doc{box-shadow:none;width:210mm;min-height:296mm;margin:0}
}
</style>
</head>
<body>
<div class="top">
  <h1>🏠 Gastos de Venta</h1>
  <button class="btn" onclick="nuevo()">+ Nuevo</button>
  <button class="btn" onclick="verGuardados()">📂 Guardados</button>
  <button class="btn" onclick="verAjustes()">⚙ Ajustes</button>
  <div class="sp"></div>
  <button class="btn p" onclick="window.print()">🖨 Imprimir / PDF</button>
</div>

<noscript><div style="margin:16px;padding:16px;border-radius:10px;background:#fff4e5;color:#8a4a0b;font:15px system-ui">⚠ Esta vista previa no ejecuta el programa. Ábrelo en <b>Safari o Chrome</b> (botón Compartir → Abrir en Safari) o usa el enlace de la web.</div></noscript>
<div class="wrap">
  <div class="panel" id="form"></div>
  <div class="prev">
    <div class="bar"><span class="hint">Hoja para el vendedor · se actualiza sola · <b>Imprimir / PDF</b> → «Guardar como PDF» para enviarla por WhatsApp o correo.</span></div>
    <div class="docw"><div class="doc" id="doc"></div></div>
  </div>
</div>

<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fimport" accept=".json" style="display:none">
<input type="file" id="flogo" accept="image/*" style="display:none">

<script>
/* ================= CONFIGURACIÓN (editable en Ajustes) ================= */
const KE='gastosventa_v2',KC='vendedores_cfg_v1',KA='gastosventa_actual',KB='gastosventa_backup';
const DEF={agencia:'Inmobiliaria Caraballo',subtitulo:'Oficina Sevilla Este',telefono:'',email:'',web:'',logo:'',
  comerciales:['Jose','Javi','Fátima','Fco Javier','Iván'],honPct:3,iva:21,matriz:400,cancRegistral:500,tipoPlus:26.53};
// Coeficientes plusvalía (art. 107.4 TRLRHL, RDL 8/2023, vigentes 2026) y escala del ahorro IRPF 2026
// Tipos de plusvalía por municipio (provincia de Sevilla). Sevilla: ordenanza vigente. Resto: base de datos de Hacienda (SGFAL, año 2022) → orientativos.
// null = sin dato fiable (se usa 30 %, el máximo legal).
const MUNI=[["Sevilla",26.53,"ord"],["Aguadulce",3.5,"2022"],["Alanís",8.0,"2022"],["Albaida del Aljarafe",21.0,"2022"],["Alcalá de Guadaíra",30.0,"2022"],["Alcalá del Río",null,"sin"],["Alcolea del Río",24.72,"2022"],["Algaba (La)",30.0,"2022"],["Algámitas",16.0,"2022"],["Almadén de la Plata",30.0,"2022"],["Almensilla",null,"sin"],["Arahal",30.0,"2022"],["Aznalcóllar",null,"sin"],["Badolatosa",28.0,"2022"],["Benacazón",30.0,"2022"],["Bollullos de la Mitación",30.0,"2022"],["Burguillos",30.0,"2022"],["Cabezas de San Juan (Las)",27.0,"2022"],["Camas",29.37,"2022"],["Campana (La)",30.0,"2022"],["Cantillana",29.7,"2022"],["Carmona",null,"sin"],["Carrión de los Céspedes",24.0,"2022"],["Casariche",30.0,"2022"],["Castilblanco de los Arroyos",25.0,"2022"],["Castilleja de la Cuesta",29.0,"2022"],["Cañada Rosal",20.0,"2022"],["Coria del Río",29.99,"2022"],["Coronil (El)",25.0,"2022"],["Corrales (Los)",19.0,"2022"],["Dos Hermanas",25.16,"2022"],["Écija",28.0,"2022"],["Espartinas",30.0,"2022"],["Estepa",20.0,"2022"],["Fuentes de Andalucía",30.0,"2022"],["Gelves",30.0,"2022"],["Gerena",30.0,"2022"],["Gilena",3.0,"2022"],["Gines",30.0,"2022"],["Guadalcanal",16.0,"2022"],["Guillena",26.0,"2022"],["Huévar del Aljarafe",25.0,"2022"],["Isla Mayor",28.0,"2022"],["Lantejuela",30.0,"2022"],["Lebrija",30.0,"2022"],["Lora del Río",28.0,"2022"],["Luisiana (La)",17.0,"2022"],["Mairena del Alcor",30.0,"2022"],["Mairena del Aljarafe",30.0,"2022"],["Marchena",null,"sin"],["Marinaleda",22.0,"2022"],["Martín de la Jara",null,"sin"],["Montellano",30.0,"2022"],["Morón de la Frontera",30.0,"2022"],["Navas de la Concepción (Las)",26.0,"2022"],["Olivares",30.0,"2022"],["Osuna",30.0,"2022"],["Palacios y Villafranca (Los)",26.44,"2022"],["Palomares del Río",30.0,"2022"],["Paradas",30.0,"2022"],["Pedrera",30.0,"2022"],["Pedroso (El)",20.0,"2022"],["Peñaflor",21.0,"2022"],["Pruna",null,"sin"],["Puebla de Cazalla (La)",18.0,"2022"],["Puebla de los Infantes (La)",26.0,"2022"],["Puebla del Río (La)",null,"sin"],["Real de la Jara (El)",22.0,"2022"],["Rinconada (La)",26.9,"2022"],["Roda de Andalucía (La)",11.0,"2022"],["Ronquillo (El)",25.0,"2022"],["Rubio (El)",9.45,"2022"],["Salteras",26.0,"2022"],["San Juan de Aznalfarache",null,"sin"],["Sanlúcar la Mayor",null,"sin"],["Santiponce",30.0,"2022"],["Tocina",14.5,"2022"],["Tomares",30.0,"2022"],["Umbrete",30.0,"2022"],["Utrera",28.0,"2022"],["Valencina de la Concepción",29.0,"2022"],["Villamanrique de la Condesa",2.8,"2022"],["Villanueva de San Juan",15.0,"2022"],["Villanueva del Ariscal",30.0,"2022"],["Villanueva del Río y Minas",27.0,"2022"],["Villaverde del Río",29.26,"2022"],["Viso del Alcor (El)",26.56,"2022"]];
const COEF=[0.15,0.15,0.14,0.14,0.16,0.18,0.19,0.20,0.19,0.15,0.12,0.10,0.09,0.09,0.09,0.09,0.10,0.13,0.17,0.23,0.40];
const TRAMOS=[[6000,19],[50000,21],[200000,23],[300000,27],[Infinity,30]];

/* ================= DATOS ================= */
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('⚠ No se pudo guardar. Haz una copia.')}};
let cfg=Object.assign({},DEF,lsGet(KC,{}));
let lista=lsGet(KE,null);
if(!lista){ // trae los estudios de la versión anterior, si los hay
  lista=(lsGet('vendedores_estudios_v1',[])||[]).map(o=>({id:o.id,creado:o.creado,actualizado:o.actualizado,propietario:o.propietario||'',telefono:o.telefono||'',direccion:o.direccion||'',municipio:o.municipio||'',comercial:o.comercial||'',fecha:o.fechaEstudio||hoyF(),
    precio:o.precioVenta||null,hip:o.hipoteca||null,cancHip:o.cancModo==='eur'?(o.comisionEur||null):((o.hipoteca||0)*(o.comisionPct||0)/100||null),cancReg:o.cancRegistral??o.gastosCanc??null,
    plus:o.plusModo==='mano'?o.plusMano:null,matriz:o.matriz??o.notaria??null,irpf:o.irpfModo==='mano'?o.irpfMano:null,
    honModo:o.honTipo==='fijo'?'eur':'pct',honPct:o.honPct??cfg.honPct,honEur:o.honFijo||null,honIva:o.honIva!==false,extras:o.extras||[],notas:o.notas||'',escenarios:true}));
  lsSet(KE,lista);
}
let e=null;

/* ================= UTILIDADES ================= */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hoyF(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
const money=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(/\s|€/g,'').replace(/\./g,'').replace(',','.'));return isFinite(n)?n:null};
const dec=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(/\s|%/g,'').replace(',','.'));return isFinite(n)?n:null};
const fmt=(n,d=0)=>new Intl.NumberFormat('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'}).format(n||0);
const eur=n=>(n<0?'−':'')+fmt(Math.abs(Math.round(n||0)))+' €';
const vIn=v=>v==null||v===''?'':fmt(v,v%1?2:0);
const fLarga=s=>s?new Date(s+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}):'';
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('on');clearTimeout(x._t);x._t=setTimeout(()=>x.classList.remove('on'),2400)}

/* ================= CÁLCULO ================= */
function honorarios(o,P){const b=o.honModo==='eur'?(o.honEur||0):P*(o.honPct||0)/100;return b*(o.honIva?1+cfg.iva/100:1)}
function calc(o,precio){
  const P=precio!=null?precio:(o.precio||0);
  const hon=honorarios(o,P);
  const ext=(o.extras||[]).reduce((a,x)=>a+(x.v||0),0);
  const gastos=(o.cancHip||0)+(o.cancReg||0)+(o.plus||0)+(o.matriz||0)+hon+ext; // sin hipoteca ni IRPF
  const firma=P-(o.hip||0)-gastos;
  return {P,hon,ext,gastos,firma,irpf:o.irpf||0,neto:firma-(o.irpf||0),totalGI:gastos+(o.irpf||0)};
}
function cuotaAhorro(b){let c=0,prev=0;for(const[l,t]of TRAMOS){if(b>prev)c+=(Math.min(b,l)-prev)*t/100;prev=l;if(b<=l)break}return c}

/* ================= ESTUDIO ================= */
function nuevoE(){return {id:uid(),creado:new Date().toISOString(),actualizado:'',propietario:'',telefono:'',direccion:'',municipio:'Sevilla',comercial:cfg.comerciales[0]||'',fecha:hoyF(),
  precio:null,hip:null,cancHip:null,cancReg:null,plus:null,matriz:cfg.matriz,irpf:null,honModo:'pct',honPct:cfg.honPct,honEur:null,honIva:true,extras:[],notas:'',escenarios:true}}
const tiene=o=>!!(o.propietario||o.direccion||o.precio);
let tG;
function guardar(ya){clearTimeout(tG);const f=()=>{if(!tiene(e))return;e.actualizado=new Date().toISOString();const i=lista.findIndex(x=>x.id===e.id);const c=JSON.parse(JSON.stringify(e));if(i<0)lista.unshift(c);else lista[i]=c;lsSet(KE,lista);localStorage.setItem(KA,e.id)};ya?f():tG=setTimeout(f,400)}
function nuevo(){guardar(1);e=nuevoE();localStorage.removeItem(KA);pintarForm();pintarDoc();cerrar();toast('Nuevo estudio')}
function abrir(id){guardar(1);const x=lista.find(o=>o.id===id);if(!x)return;e=JSON.parse(JSON.stringify(x));localStorage.setItem(KA,id);pintarForm();pintarDoc();cerrar()}

/* ================= FORMULARIO (comercial) ================= */
const In=(k,t,ph,cls)=>'<input data-k="'+k+'" data-t="'+t+'" '+(t==='eur'||t==='dec'?'inputmode="decimal" ':'')+'placeholder="'+esc(ph||'')+'" value="'+esc(t==='eur'||t==='dec'?vIn(e[k]):(e[k]||''))+'"'+(cls?' class="'+cls+'"':'')+'>';
const opts=(a,s)=>a.map(v=>'<option'+(v===s?' selected':'')+'>'+esc(v)+'</option>').join('');
function linea(n,label,k,sub){return '<div class="gl"><span class="n">'+n+'</span><span class="l">'+label+(sub?'<small>'+sub+'</small>':'')+'</span>'+In(k,'eur','0')+'</div>'}
function pintarForm(){
  const coms=cfg.comerciales.includes(e.comercial)||!e.comercial?cfg.comerciales:cfg.comerciales.concat(e.comercial);
  $('#form').innerHTML=
  '<h2>Vendedor e inmueble</h2>'+
  '<label class="f">Propietario/s'+In('propietario','txt')+'</label>'+
  '<label class="f">Dirección del inmueble'+In('direccion','txt')+'</label>'+
  '<div class="two"><label class="f">Teléfono'+In('telefono','txt')+'</label><label class="f">Comercial<select data-k="comercial" data-t="txt">'+opts(coms,e.comercial)+'</select></label></div>'+
  '<h2>Precio de venta</h2><label class="f big">'+In('precio','eur','Ej. 250.000')+'</label>'+

/* ===== ZONAS: aprendizaje con recibos (local + nube compartida) ===== */
const KM='gastosventa_muestras';
const SB_URL_DEF='https://elbvshufqehfkbgpgov.supabase.co';
let muestras=lsGet(KM,[]);           // recibos guardados en este dispositivo
let nube=[],nubeEstado='off';         // recibos del equipo (Supabase)
const sbCfg=()=>({url:(cfg.sbUrl||SB_URL_DEF).replace(/\/+$/,''),key:(cfg.sbKey||'').trim()});
const sbH=k=>({'apikey':k,'Authorization':'Bearer '+k,'Content-Type':'application/json'});
async function nubeCargar(){
  const {url,key}=sbCfg();if(!key){nubeEstado='off';return}
  try{const r=await fetch(url+'/rest/v1/zonas_suelo?select=id,zona,municipio,m2,suelo,comercial,created_at&order=created_at.desc&limit=5000',{headers:sbH(key)});
    if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,120));
    nube=(await r.json()).map(x=>({id:x.id,zona:x.zona,muni:x.municipio,m2:+x.m2,suelo:+x.suelo,com:x.comercial,fecha:x.created_at,nube:1}));
    nubeEstado='ok';
    // sube los recibos locales que aún no estén en la nube
    const ids=new Set(nube.map(x=>x.id));const pend=muestras.filter(x=>!ids.has(x.id));
    if(pend.length&&await nubeSubir(pend))nube=nube.concat(pend.map(x=>Object.assign({},x,{nube:1})));
  }catch(err){nubeEstado='error: '+err.message;console.warn(err)}
  refrescarZonas();
}
async function nubeSubir(arr){
  const {url,key}=sbCfg();if(!key||!arr.length)return false;
  try{const r=await fetch(url+'/rest/v1/zonas_suelo',{method:'POST',headers:Object.assign(sbH(key),{'Prefer':'return=minimal,resolution=ignore-duplicates'}),
      body:JSON.stringify(arr.map(x=>({id:x.id,zona:x.zona,municipio:x.muni||null,m2:x.m2,suelo:x.suelo,comercial:x.com||null})))});
    if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,120));nubeEstado='ok';return true}
  catch(err){nubeEstado='error: '+err.message;console.warn(err);return false}
}
function todasMuestras(){const m=new Map();nube.concat(muestras).forEach(x=>{if(!m.has(x.id))m.set(x.id,x)});return [...m.values()]}
function zonasStats(){
  const g={};
  todasMuestras().forEach(x=>{if(!x.zona||!(x.m2>0)||!(x.suelo>0))return;const k=norm2(x.zona);(g[k]=g[k]||{nombre:x.zona,n:0,s:0,min:1e9,max:0,muni:x.muni});const em=x.suelo/x.m2;g[k].n++;g[k].s+=em;g[k].min=Math.min(g[k].min,em);g[k].max=Math.max(g[k].max,em)});
  const out=Object.values(g).map(z=>({nombre:z.nombre,em:z.s/z.n,n:z.n,min:z.min,max:z.max,muni:z.muni}));
  (cfg.zonasSuelo||[]).forEach(([n,v])=>{if(!out.some(z=>norm2(z.nombre)===norm2(n)))out.push({nombre:n,em:v,n:0,manual:1})});
  return out.sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
}
const zonaInfo=n=>zonasStats().find(z=>norm2(z.nombre)===norm2(n));
function zonasOpts(){return zonasStats().map(z=>'<option value="'+esc(z.nombre)+'">'+fmt(z.em,2)+' €/m²'+(z.n?' · '+z.n+' recibo'+(z.n>1?'s':''):' · manual')+'</option>').join('')}
function refrescarZonas(){const l=$('#pv_zl');if(l)l.innerHTML=zonasOpts();if($('#pv_h'))ayudaZona()}
function registrarMuestra(zona,m2,suelo){
  zona=(zona||'').trim();if(!zona||!(m2>0)||!(suelo>0))return null;
  const em=suelo/m2;if(em<15||em>3000){toast('⚠ '+fmt(em,2)+' €/m² parece raro: revisa suelo y m²');return null}
  if(todasMuestras().some(x=>norm2(x.zona)===norm2(zona)&&Math.abs(x.m2-m2)<0.01&&Math.abs(x.suelo-suelo)<0.01))return 'dup';
  const x={id:uid(),zona,muni:($('#pv_mu')&&$('#pv_mu').value)||'',m2,suelo,com:e.comercial||'',fecha:new Date().toISOString()};
  muestras.push(x);lsSet(KM,muestras);
  nubeSubir([x]).then(ok=>{if(ok)nube.push(Object.assign({},x,{nube:1}));refrescarZonas()});
  refrescarZonas();return x;
}
function ayudaZona(){
  const zs=zonasStats(),n=zs.length,z=$('#pv_z')?zonaInfo($('#pv_z').value):null;
  const red=nubeEstado==='ok'?' · ☁ compartido con el equipo':nubeEstado.startsWith('error')?' · ⚠ sin conexión con la base del equipo':'';
  $('#pv_h').innerHTML=z?'<b>'+esc(z.nombre)+'</b>: '+fmt(z.em,2)+' €/m²'+(z.n?' · media de '+z.n+' recibo'+(z.n>1?'s':'')+(z.n>1?' ('+fmt(z.min,0)+'–'+fmt(z.max,0)+')':''):' · dato manual')+red
    :n?n+' zona'+(n>1?'s':'')+' con datos'+red+'. Escribe o elige la zona y se pone su €/m². Los recibos que metas (suelo + m² + zona) se guardan solos.'
    :'<b>€/m² de suelo</b> = suelo del recibo ÷ m² construidos. Mete un recibo real (suelo, m² y zona) y se guarda solo como referencia'+red+'.'}
let pvSueloReal=null;
const norm2=s=>String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function calcPlus(){
  let s=money($('#pv_s').value);const f=$('#pv_f').value,t=dec($('#pv_t').value),m2=dec($('#pv_m2').value),em=dec($('#pv_em').value);pvVal=null;
  let est=false;
  if(s&&m2)pvSueloReal={m2,em:s/m2};else pvSueloReal=null;
  if(!s&&m2&&em){s=m2*em;est=true}
  if(!s||!f||t==null){$('#pv_r').textContent=!s?'Pon el suelo del recibo, o los m² y el €/m² de la zona.':'Pon la fecha de compra.';return}
  const a=new Date(f+'T12:00:00'),b=new Date();let m=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());if(b.getDate()<a.getDate())m--;m=Math.max(0,m);
  const y=Math.floor(m/12),coef=y<1?COEF[0]*m/12:COEF[Math.min(y,20)];
  const pc=Math.min(100,Math.max(0,dec($('#pv_p').value)??100));
  pvVal=Math.round(s*(pc/100)*coef*t/100*100)/100;
  $('#pv_r').innerHTML=(est?'Suelo estimado '+eur(s)+' · ':'')+(y>=20?'20 años o más (tope)':y+(y===1?' año':' años'))+' · coef. '+fmt(coef,2)+(pc<100?' · '+fmt(pc,0)+' %':'')+' → <b>'+fmt(pvVal,2)+' €</b>'+
    (pvSueloReal?'<br><span class="hint">Recibo real: '+fmt(pvSueloReal.em,2)+' €/m²'+($('#pv_z').value.trim()?' · se guardará en «'+esc($('#pv_z').value.trim())+'» al pulsar Usar':' · escribe la zona para guardarlo')+'</span>':'');
}
function guardarZona(){

 e.plus=pvVal;$('[data-k=plus]').value=vIn(pvVal);$('#dplus').open=false;guardar();pintarTotales();pintarDoc();calcIrpf()}
function calcIrpf(){
  const cp=money($('#ir_c').value);irVal=null;
  if(!cp){$('#ir_r').textContent='Rellena el precio de compra.';return}
  const n=Math.max(1,Math.round(money($('#ir_n').value)||1));

}

  (c.P?'<div class="vb">'+segs.map(s=>'<div style="width:'+(s[0]/st*100)+'%;background:'+s[1]+'"></div>').join('')+'</div><div class="vl">'+segs.map(s=>'<span><i style="background:'+s[1]+'"></i>'+s[2]+' '+eur(s[0])+'</span>').join('')+'</div>':'')+
  (esc3?'<div class="dt" style="margin-top:6mm">Si se negocia el precio</div><table class="t"><tr><th>Precio de cierre</th><th class="r">Gastos e impuestos</th><th class="r">Le queda limpio</th></tr>'+
    esc3.map(s=>'<tr'+(s.r===0?' class="cur"':'')+'><td>'+eur(s.p)+(s.r?' <span style="color:#8a93a2;font-size:8pt">(−'+s.r+' %)</span>':' <span style="color:#8a93a2;font-size:8pt">(precio de salida)</span>')+'</td><td class="r">'+eur(s.c.totalGI)+'</td><td class="r"><b>'+eur(s.c.neto)+'</b></td></tr>').join('')+'</table>':'')+
  (e.notas?'<div class="obs">'+esc(e.notas).replace(/\n/g,'<br>')+'</div>':'')+
  '<div class="df"><div class="lgl">Documento orientativo elaborado con los datos facilitados por el propietario. La plusvalía municipal y el IRPF son estimaciones aproximadas: la liquidación definitiva corresponde al Ayuntamiento y a la Agencia Tributaria y puede variar según la situación de cada titular. Los gastos de notaría y registro dependen de los aranceles aplicables. No constituye asesoramiento fiscal.</div>'+
    '<div class="ct"><span><b>'+esc(cfg.agencia)+'</b>'+(cfg.subtitulo?' · '+esc(cfg.subtitulo):'')+'</span><span>'+[cfg.telefono,cfg.email,cfg.web].filter(Boolean).map(esc).join(' · ')+'</span></div></div>';
}

/* ================= GUARDADOS / AJUSTES ================= */
function cerrar(){$('#modal').classList.remove('on')}
$('#modal').addEventListener('mousedown',ev=>{if(ev.target.id==='modal')cerrar()});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')cerrar()});
function verGuardados(){
  guardar(1);
  $('#mbox').innerHTML='<h3>Estudios guardados<button class="btn s" onclick="cerrar()">✕</button></h3><input id="qg" placeholder="Buscar por propietario, dirección o teléfono…" style="margin-bottom:8px"><div id="lg"></div>'+
    '<div class="hint" style="margin-top:12px">Se guardan solos mientras escribes, en este navegador.</div>';
  const pinta=()=>{const q=$('#qg').value.trim().toLowerCase();const r=lista.filter(o=>!q||[o.propietario,o.direccion,o.telefono,o.comercial].join(' ').toLowerCase().includes(q));
    $('#lg').innerHTML=r.length?r.map(o=>'<div class="it"><div class="m" onclick="abrir(\''+o.id+'\')"><b>'+esc(o.propietario||'(sin nombre)')+'</b><span>'+esc(o.direccion||'')+' · '+(o.precio?eur(o.precio)+' → limpio '+eur(calc(o).neto):'sin precio')+' · '+esc(o.comercial||'')+'</span></div><button class="btn s" onclick="duplicar(\''+o.id+'\')">Duplicar</button><button class="btn s d" onclick="borrar(\''+o.id+'\')">✕</button></div>').join(''):'<div class="hint">No hay estudios.</div>'};
  $('#qg').addEventListener('input',pinta);pinta();$('#modal').classList.add('on');
}
function duplicar(id){const x=lista.find(o=>o.id===id);guardar(1);e=JSON.parse(JSON.stringify(x));e.id=uid();e.fecha=hoyF();e.propietario+=' (copia)';guardar(1);pintarForm();pintarDoc();cerrar();toast('Duplicado')}
function borrar(id){const x=lista.find(o=>o.id===id);if(!confirm('¿Eliminar el estudio de '+(x.propietario||x.direccion||'sin nombre')+'?'))return;lista=lista.filter(o=>o.id!==id);lsSet(KE,lista);if(e.id===id){e=nuevoE();pintarForm();pintarDoc()}verGuardados()}
function verAjustes(){
  const A=(k,l,t)=>'<label class="f">'+l+'<input data-a="'+k+'" data-t="'+(t||'txt')+'" value="'+esc(t?fmt(cfg[k],cfg[k]%1?2:0):cfg[k])+'"></label>';
  const u=localStorage.getItem(KB);
  $('#mbox').innerHTML='<h3>Ajustes<button class="btn s" onclick="cerrar()">✕</button></h3>'+
    '<div class="two">'+A('agencia','Agencia')+A('subtitulo','Oficina')+A('telefono','Teléfono')+A('email','Email')+'</div>'+A('web','Web')+
    '<div style="display:flex;gap:10px;align-items:center;margin-bottom:12px">'+(cfg.logo?'<img src="'+cfg.logo+'" style="max-height:40px;max-width:160px;border:1px solid var(--line);padding:3px;border-radius:4px">':'<span class="hint">Sin logo</span>')+
      '<button class="btn s" onclick="$(\'#flogo\').click()">'+(cfg.logo?'Cambiar logo':'Subir logo')+'</button>'+(cfg.logo?'<button class="btn s d" onclick="cfg.logo=\'\';lsSet(KC,cfg);verAjustes();pintarDoc()">Quitar</button>':'')+'</div>'+
    '<div class="two">'+A('honPct','Honorarios por defecto (%)','dec')+A('iva','IVA (%)','dec')+A('matriz','Matriz notarial (€)','eur')+A('cancRegistral','Cancelación registral (€)','eur')+A('tipoPlus','Tipo plusvalía Sevilla (%)','dec')+'</div>'+
    '<label class="f">Comerciales (uno por línea)<textarea id="acom" rows="4">'+esc(cfg.comerciales.join('\n'))+'</textarea></label>'+
    '<label class="f">Zonas manuales, sin recibo (una por línea: Zona;€/m²)<textarea id="azon" rows="3" placeholder="Parque Alcosa;210">'+esc((cfg.zonasSuelo||[]).map(z=>z[0]+';'+String(z[1]).replace('.',',')).join('\n'))+'</textarea></label>'+
    '<button class="btn p" onclick="guardarAjustes()">Guardar ajustes</button>'+
    '<h3 style="margin-top:22px">📍 Valor del suelo por zona</h3>'+
    '<p class="hint">Base del equipo: '+(nubeEstado==='ok'?'<b style="color:#1f7a45">☁ conectada</b> · '+nube.length+' recibos':nubeEstado==='off'?'<b>no configurada</b> (solo este dispositivo)':'<b style="color:#b42318">⚠ '+esc(nubeEstado)+'</b>')+' · '+muestras.length+' recibos metidos en este dispositivo.</p>'+
    tablaZonas()+
    '<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600;font-size:13px">☁ Conexión con la base del equipo (Supabase)</summary>'+
      '<label class="f" style="margin-top:8px">URL del proyecto<input id="sb_url" value="'+esc(sbCfg().url)+'"></label>'+
      '<label class="f">Clave «anon public»<textarea id="sb_key" rows="3" placeholder="eyJhbGciOi…">'+esc(cfg.sbKey||'')+'</textarea></label>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn p" onclick="guardarNube()">Guardar y probar conexión</button>'+(muestras.length?'<button class="btn" onclick="exportarZonas()">Descargar recibos (CSV)</button>':'')+'</div>'+
      '<p class="hint" style="margin-top:8px">La clave está en Supabase → tu proyecto → <b>Project Settings → API Keys → anon public</b>. Es la misma que usa Mis Alquileres.</p></details>'+
    '<h3 style="margin-top:22px">Copias de seguridad</h3><p class="hint">Última copia: '+(u?new Date(u).toLocaleString('es-ES'):'nunca')+' · '+lista.length+' estudios. Haz una de vez en cuando y mándatela por correo.</p>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="exportar()">Hacer copia</button><button class="btn" onclick="$(\'#fimport\').click()">Restaurar copia</button></div>';
  $('#modal').classList.add('on');
}
function tablaZonas(){
  const zs=zonasStats();if(!zs.length)return '<p class="hint">Todavía no hay zonas.</p>';
  return '<div style="max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:6px"><table style="width:100%;border-collapse:collapse;font-size:13px">'+
    '<tr style="background:#f6f8fb;text-align:left"><th style="padding:6px 8px">Zona</th><th style="padding:6px 8px;text-align:right">€/m²</th><th style="padding:6px 8px;text-align:right">Recibos</th></tr>'+
    zs.map(z=>'<tr style="border-top:1px solid var(--line)"><td style="padding:6px 8px">'+esc(z.nombre)+'</td><td style="padding:6px 8px;text-align:right">'+fmt(z.em,2)+'</td><td style="padding:6px 8px;text-align:right">'+(z.n||'manual')+'</td></tr>').join('')+'</table></div>';
}
async function guardarNube(){
  cfg.sbUrl=$('#sb_url').value.trim()||SB_URL_DEF;cfg.sbKey=$('#sb_key').value.replace(/\s+/g,'');lsSet(KC,cfg);
  toast('Conectando…');await nubeCargar();
  toast(nubeEstado==='ok'?'☁ Conectado · '+nube.length+' recibos del equipo':nubeEstado==='off'?'Sin clave: solo este dispositivo':'⚠ No conecta: '+nubeEstado.replace('error: ',''));
  verAjustes();
}
function exportarZonas(){
  const rows=[['Zona','Municipio','m2','Suelo','€/m2','Comercial','Fecha']].concat(todasMuestras().map(x=>[x.zona,x.muni||'',x.m2,x.suelo,(x.suelo/x.m2).toFixed(2),x.com||'',(x.fecha||'').slice(0,10)]));
  const csv='\ufeff'+rows.map(r=>r.map(v=>{v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='recibos_suelo_'+hoyF()+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500);
}
function guardarAjustes(){
  document.querySelectorAll('[data-a]').forEach(i=>{const t=i.dataset.t,v=t==='dec'?dec(i.value):t==='eur'?money(i.value):i.value.trim();if(t==='txt'||v!=null)cfg[i.dataset.a]=v});
  cfg.comerciales=$('#acom').value.split('\n').map(s=>s.trim()).filter(Boolean);
  cfg.zonasSuelo=$('#azon').value.split('\n').map(l=>l.split(';')).filter(p=>p[0]&&p[0].trim()&&dec(p[1])).map(p=>[p[0].trim(),dec(p[1])]);
  lsSet(KC,cfg);cerrar();pintarForm();pintarDoc();toast('Ajustes guardados');
}
$('#flogo').addEventListener('change',ev=>{const f=ev.target.files[0];if(!f)return;if(f.size>800000){alert('Usa un logo de menos de 800 KB.');return}const r=new FileReader();r.onload=()=>{cfg.logo=r.result;lsSet(KC,cfg);verAjustes();pintarDoc();toast('Logo guardado')};r.readAsDataURL(f)});
function exportar(){guardar(1);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'gastos-venta',version:2,cfg,lista,muestras})],{type:'application/json'}));a.download='gastos_venta_copia_'+hoyF()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500);localStorage.setItem(KB,new Date().toISOString());toast('Copia descargada');verAjustes()}
$('#fimport').addEventListener('change',ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let j;try{j=JSON.parse(r.result)}catch(x){alert('Archivo no válido.');return}if(!j||!Array.isArray(j.lista)){alert('No es una copia de este programa.');return}
  if(!confirm('¿Sustituir tus '+lista.length+' estudios por los '+j.lista.length+' de la copia?'))return;lista=j.lista;if(j.cfg)cfg=Object.assign({},DEF,j.cfg);if(Array.isArray(j.muestras)){const ids=new Set(muestras.map(x=>x.id));muestras=muestras.concat(j.muestras.filter(x=>!ids.has(x.id)));lsSet(KM,muestras)}lsSet(KE,lista);lsSet(KC,cfg);e=lista[0]?JSON.parse(JSON.stringify(lista[0])):nuevoE();pintarForm();pintarDoc();cerrar();toast('Copia restaurada')};r.readAsText(f);ev.target.value=''});

/* ================= ARRANQUE ================= */
window.addEventListener('beforeunload',()=>guardar(1));
{const id=localStorage.getItem(KA);const x=id&&lista.find(o=>o.id===id);e=x?JSON.parse(JSON.stringify(x)):nuevoE()}
pintarForm();pintarDoc();
nubeCargar();
</script>
</body>
</html>
